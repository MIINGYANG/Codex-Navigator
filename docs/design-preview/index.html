<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Codex Navigator · 三个 Web 设计方向</title>
<style>
:root{font-family:"Noto Sans CJK SC",system-ui,sans-serif;color:#263246;background:#edf0f4}*{box-sizing:border-box}body{margin:0}button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #3568d4;outline-offset:3px}header{padding:20px 30px 16px;display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:19px;font-weight:600;letter-spacing:-.5px;margin:0}header p{font-size:11px;color:#778193;margin:5px 0 0}.tag{font-size:10px;border:1px solid #d3dae4;border-radius:6px;padding:5px 9px;background:#f7f9fc;white-space:nowrap}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 30px}.option{text-align:left;display:flex;align-items:center;gap:13px;background:#f8fafc;border:1px solid #dce2eb;border-radius:10px;padding:13px 16px;color:inherit;position:relative}.option[aria-pressed=true]{border-color:#3568d4;background:#fff;box-shadow:0 0 0 1px #3568d4}.option:hover{background:#fff}.letter{display:grid;place-items:center;width:32px;height:36px;flex-shrink:0;background:#e8effc;color:#3568d4;border-radius:5px;font:15px monospace}.b .letter{background:#ede7f7;color:#7156ab}.c .letter{background:#202d3b;color:#68b9d7}.option strong{font-size:13px;font-weight:600}.option small{display:block;font-size:10px;color:#778193;margin-top:4px}.option .picked{position:absolute;right:12px;top:12px;color:#3568d4;font-size:10px}.controls{display:flex;justify-content:space-between;align-items:center;padding:13px 30px;gap:12px}.switch{display:flex;border:1px solid #d3dae4;border-radius:6px;padding:3px;background:#e5eaf0;gap:2px}.switch button{border:0;border-radius:4px;padding:5px 11px;color:#687589;background:transparent;font-size:10px}.switch button[aria-pressed=true]{background:#fff;color:#263246;box-shadow:0 1px 3px #2632460a}.tools{display:flex;gap:13px;align-items:center}a{color:#687589;font-size:11px;text-decoration:none}a:hover{text-decoration:underline}.choose{border:0;border-radius:6px;background:#263246;color:#fff;font-size:11px;padding:8px 13px}.canvas{padding:0 22px 18px}iframe{display:block;border:1px solid #d3dae4;border-radius:12px;background:#fff;width:100%;height:calc(100vh - 229px);min-height:600px;box-shadow:0 12px 35px #26324609}.selection{margin:0 30px 15px;padding:10px 14px;border:1px solid #b8c8e6;border-radius:7px;background:#f8faff;font-size:12px}.selection[hidden]{display:none}.note{margin-left:10px;color:#778193;font-size:10px}.mobile{display:none}@media(max-width:720px){header{padding:17px 16px;align-items:flex-start}h1{font-size:16px}header .tag{display:none}.choices{padding:0 12px;gap:6px}.option{padding:10px 7px;gap:6px;align-items:flex-start}.letter{width:20px;height:25px;font-size:12px}.option strong{font-size:10px}.option small{font-size:9px}.option .picked{display:none}.controls{padding:12px;align-items:center}.tools{gap:8px}.note{display:none}.choose{font-size:10px;padding:7px}.tools a{font-size:10px}.canvas{padding:0 6px 10px}iframe{border-radius:9px;height:calc(100dvh - 205px);min-height:610px}.selection{margin:0 12px 12px;font-size:11px}.switch button{padding:5px 7px}.desktop{display:none}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body>
<header><div><h1>Codex Navigator <span style="font-weight:400;color:#8892a2">/ Web 设计预选</span></h1><p>三个布局方向，一套只读工作流。先选体验，再接入本地会话。</p></div><span class="tag">HTML 交互样稿 · 尚未实现 codex-nav --web</span></header>
<nav class="choices" aria-label="设计方案"><button class="option a" data-design="a" aria-pressed="true"><span class="letter">A</span><span><strong>清晰工作台</strong><small>浅色三栏 · 定位与阅读并行</small></span><span class="picked">当前预览</span></button><button class="option b" data-design="b" aria-pressed="false"><span class="letter">B</span><span><strong>专注阅读</strong><small>轻量目录 · 留白与长文优先</small></span><span class="picked" hidden>当前预览</span></button><button class="option c" data-design="c" aria-pressed="false"><span class="letter">C</span><span><strong>紧凑控制台</strong><small>深色双区 · 高密度与快捷操作</small></span><span class="picked" hidden>当前预览</span></button></nav>
<div class="controls"><div style="display:flex;align-items:center"><div class="switch" aria-label="预览页面"><button data-view="reader" aria-pressed="true">阅读界面</button><button data-view="picker" aria-pressed="false">会话入口</button></div><span class="note">可点击、搜索、折叠活动；按 ? 查看快捷键</span></div><div class="tools"><a id="standalone" href="a.html?view=reader" target="_blank" rel="noopener">独立打开 ↗</a><button class="choose" id="choose">标记 A 方案</button></div></div>
<p class="selection" id="selection" role="status" hidden></p><div class="canvas"><iframe id="preview" title="A 清晰工作台交互预览" src="a.html?view=reader" allow="clipboard-write"></iframe></div>
<script>
const names={a:'清晰工作台',b:'专注阅读',c:'紧凑控制台'};let current='a',view='reader';const frame=document.getElementById('preview');
function update(){document.querySelectorAll('[data-design]').forEach(b=>{const chosen=b.dataset.design===current;b.setAttribute('aria-pressed',String(chosen));b.querySelector('.picked').hidden=!chosen});document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));const url=current+'.html'+(view==='reader'?'?view=reader':'');frame.src=url;frame.title=current.toUpperCase()+' '+names[current]+'交互预览';document.getElementById('standalone').href=url;document.getElementById('choose').textContent='标记 '+current.toUpperCase()+' 方案';history.replaceState(null,'','#'+current)}
document.querySelectorAll('[data-design]').forEach(b=>b.onclick=()=>{current=b.dataset.design;update()});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;update()});document.getElementById('choose').onclick=()=>{const selection=document.getElementById('selection');selection.hidden=false;selection.textContent='已标记 '+current.toUpperCase()+'「'+names[current]+'」。请回到对话告诉我你的选择或希望组合的细节；这不会启动正式开发。';try{localStorage.setItem('codex-nav-design-choice',current)}catch{}};if(names[location.hash.slice(1)]){current=location.hash.slice(1);update()}
</script></body></html>
