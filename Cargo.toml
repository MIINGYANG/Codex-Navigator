[package]
name = "codex-navigator"
version = "3.1.1"
edition = "2021"
rust-version = "1.88"
description = "Local terminal and web navigator with explicit Codex session management"
license = "MIT"
default-run = "codex-nav"

[[bin]]
name = "codex-nav"
path = "src/main.rs"

[[bin]]
name = "codex-trail"
path = "src/bin/codex-trail.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
directories = "6"
getrandom = "0.4"
futures-util = "0.3"
memchr = "2"
notify = "8"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "time", "sync", "macros"] }
unicode-segmentation = "1.12"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
